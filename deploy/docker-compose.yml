name: agent-platform

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend-build: &backend-build
  context: ../backend
  dockerfile: Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent}
      POSTGRES_DB: ${POSTGRES_DB:-agent_platform}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [agentnet]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [agentnet]

  backend:
    build: *backend-build
    restart: unless-stopped
    logging: *default-logging
    init: true
    env_file: [.env]
    volumes:
      - ${ARTIFACTS_ROOT:-/data/artifacts}:${ARTIFACTS_ROOT:-/data/artifacts}:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [agentnet]

  worker:
    build: *backend-build
    restart: unless-stopped
    logging: *default-logging
    init: true
    stop_grace_period: 30s
    env_file: [.env]
    command: ["arq", "app.workers.tasks.WorkerSettings"]
    volumes:
      # Docker socket is root-equivalent on the host; in production put a
      # socket proxy (e.g. tecnativa/docker-socket-proxy) in front of it.
      - /var/run/docker.sock:/var/run/docker.sock
      # Mirrored path (host path == container path) lets the worker bind-mount
      # per-task subdirectories into sandbox containers via the Docker socket.
      - ${WORKSPACES_ROOT:-/data/workspaces}:${WORKSPACES_ROOT:-/data/workspaces}
      - ${ARTIFACTS_ROOT:-/data/artifacts}:${ARTIFACTS_ROOT:-/data/artifacts}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [agentnet]

  bot:
    profiles: ["telegram"]
    build: *backend-build
    restart: unless-stopped
    logging: *default-logging
    init: true
    env_file: [.env]
    command: ["python", "-m", "app.bot.main"]
    volumes:
      - ${ARTIFACTS_ROOT:-/data/artifacts}:${ARTIFACTS_ROOT:-/data/artifacts}:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [agentnet]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL:-ws://localhost:8000}
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
    networks: [agentnet]

volumes:
  pgdata:
  redisdata:

networks:
  agentnet:
    driver: bridge

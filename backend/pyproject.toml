[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform-backend"
version = "0.1.0"
description = "Autonomous agent platform: FastAPI + aiogram + arq + Docker sandboxes"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.7.0",
    "aiohttp-socks>=0.8.0",
    "alembic>=1.13.1",
    "arq>=0.26.1",
    "asyncpg>=0.29.0",
    "bcrypt>=4.1.2",
    "docker>=7.1.0",
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "openai>=1.35.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "PyJWT>=2.8.0",
    "redis>=5.0.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20.0",
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
